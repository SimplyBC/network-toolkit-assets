name: Publish signed support pack
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: support-pack-publish
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests
      - run: python tools/audit_public.py
      - name: Sign validated release
        env:
          SUPPORT_PACK_SIGNING_KEY: ${{ secrets.SUPPORT_PACK_SIGNING_KEY }}
        run: python tools/build.py --sign
      - name: Publish stable channel and versioned release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp dist/support-pack.json channel/stable.json
          python tools/audit_public.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add channel/stable.json
          git commit -m 'Publish signed device-support channel'
          git push origin HEAD:main
          version=$(python -c 'import json; print(json.load(open("manifest.json"))["version"])')
          gh release create "assets-v${version}" dist/support-pack.json --target main --title "Device support ${version}" --notes-file CHANGELOG.md
